<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900" role="img" aria-label="El traductor literario. Un hombre entre dos mundos.">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#241611"/>
      <stop offset="38%"  stop-color="#5a2c1c"/>
      <stop offset="62%"  stop-color="#8d4a28"/>
      <stop offset="82%"  stop-color="#5d2f1c"/>
      <stop offset="100%" stop-color="#1e120d"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="58%" r="55%">
      <stop offset="0%"   stop-color="#e0a06a" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#e0a06a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planeta1" cx="35%" cy="32%" r="70%">
      <stop offset="0%"   stop-color="#c98b5c"/>
      <stop offset="100%" stop-color="#6d3a22"/>
    </radialGradient>
    <radialGradient id="planeta2" cx="38%" cy="30%" r="70%">
      <stop offset="0%"   stop-color="#a8724c"/>
      <stop offset="100%" stop-color="#4c281a"/>
    </radialGradient>
    <linearGradient id="bruma" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#c98b5c" stop-opacity="0"/>
      <stop offset="100%" stop-color="#c98b5c" stop-opacity=".28"/>
    </linearGradient>
    <filter id="suave"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="grano">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="600" height="900" fill="url(#cielo)"/>
  <rect width="600" height="900" fill="url(#halo)"/>

  <!-- Astros -->
  <circle cx="150" cy="150" r="96" fill="url(#planeta1)" opacity=".85"/>
  <circle cx="150" cy="150" r="96" fill="none" stroke="#e8b989" stroke-opacity=".18"/>
  <circle cx="392" cy="96" r="46" fill="url(#planeta2)" opacity=".8"/>
  <circle cx="486" cy="206" r="20" fill="#d09a6c" opacity=".55"/>

  <!-- Estrellas -->
  <g fill="#f2ddc6" opacity=".55">
    <circle cx="58" cy="316" r="1.6"/><circle cx="245" cy="64" r="1.2"/>
    <circle cx="520" cy="330" r="1.5"/><circle cx="330" cy="250" r="1"/>
    <circle cx="470" cy="52" r="1.1"/><circle cx="92" cy="420" r="1.3"/>
    <circle cx="556" cy="128" r="1"/><circle cx="212" cy="352" r="1"/>
  </g>

  <!-- Cordillera lejana -->
  <path d="M0 528 Q70 470 118 496 Q168 424 232 486 Q292 442 342 500 Q404 448 458 498 Q520 462 600 494 L600 900 L0 900 Z"
        fill="#3a1e14" opacity=".8"/>
  <path d="M0 588 Q92 540 164 570 Q248 528 330 574 Q420 536 496 578 Q556 560 600 574 L600 900 L0 900 Z"
        fill="#2c1610" opacity=".85"/>
  <rect y="470" width="600" height="180" fill="url(#bruma)"/>

  <!-- Abismo: risco de la izquierda y del fondo -->
  <path d="M0 690 L120 660 L214 700 L268 690 L268 900 L0 900 Z" fill="#1a0f0a"/>
  <path d="M600 726 L470 690 L372 728 L336 716 L336 900 L600 900 Z" fill="#20120c"/>
  <ellipse cx="300" cy="742" rx="180" ry="46" fill="#c98b5c" opacity=".12" filter="url(#suave)"/>

  <!-- La figura, al borde -->
  <g fill="#120a07">
    <circle cx="196" cy="646" r="8.5"/>
    <path d="M196 654 q13 2 16 16 l4 34 q1 10 -3 12 l-3 24 2 34 -6 1 -6 -33 -4 33 -6 -1 1 -34 -3 -24 q-4 -2 -3 -12 l4 -34 q3 -14 16 -16 z"/>
    <path d="M212 684 l12 4 -3 11 -12 -4 z"/>
  </g>

  <!-- Tipografía -->
  <g text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" fill="#f7efe3">
    <text x="300" y="196" font-size="82" letter-spacing="1">El</text>
    <text x="300" y="272" font-size="82">traductor</text>
    <text x="300" y="352" font-size="82" font-style="italic">literario</text>
    <line x1="240" y1="392" x2="360" y2="392" stroke="#f7efe3" stroke-opacity=".55"/>
    <text x="300" y="434" font-size="27" font-style="italic" fill="#f2e2cf">Un hombre entre dos mundos</text>
  </g>

  <rect width="600" height="900" filter="url(#grano)" opacity=".07"/>
</svg>
